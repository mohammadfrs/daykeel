<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daykeel</title>
<meta name="description" content="Daykeel: a private daily planner that keeps your day on course.">
<meta name="theme-color" content="#1b3a5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Daykeel">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Daykeel. Layout: one centred sheet (max 46rem) under a sticky header with a tab strip.
   Palette: deep sea blue (course), sail yellow (highlights), cool harbour greys. */
:root{
  --paper:#edf0f4; --sheet:#fbfcfd; --ink:#15202c; --muted:#596574; --line:#d2d9e1; --rule:#e1e6ec;
  --accent:#1b3a5c; --accent-ink:#ffffff; --accent-soft:#dde6f0; --gold:#a8700c; --gold-soft:#f6ead2;
  --good:#2a7350; --good-soft:#dbeee3; --warn:#a8591a; --bad:#a3303d; --bad-soft:#f6dfe2;
  --f-display:"Bitter",Georgia,"Times New Roman",serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141b; --sheet:#161d27; --ink:#e3e9f0; --muted:#95a2b2; --line:#283342; --rule:#212b38;
  --accent:#8fb3dc; --accent-ink:#0d1520; --accent-soft:#1c2b3d; --gold:#e3b24e; --gold-soft:#3a2f17;
  --good:#6cc18c; --good-soft:#1b3326; --warn:#e2995a; --bad:#e3788a; --bad-soft:#3a1d22; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f141b; --sheet:#161d27; --ink:#e3e9f0; --muted:#95a2b2; --line:#283342; --rule:#212b38;
  --accent:#8fb3dc; --accent-ink:#0d1520; --accent-soft:#1c2b3d; --gold:#e3b24e; --gold-soft:#3a2f17;
  --good:#6cc18c; --good-soft:#1b3326; --warn:#e2995a; --bad:#e3788a; --bad-soft:#3a1d22; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:46rem;margin:0 auto;padding:10px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand b{font-family:var(--f-display);font-size:1.2rem;font-weight:700;letter-spacing:-.01em;display:inline-flex;align-items:center;gap:8px}
.brand b svg{width:26px;height:26px;flex:none}
.brand b span{color:var(--gold)}
.status{border:0;background:transparent;font-size:.78rem;color:var(--muted);padding:4px 0;cursor:default;white-space:nowrap}
.status[data-s="error"]{color:var(--bad);cursor:pointer;text-decoration:underline}
.status[data-s="saving"]{color:var(--gold)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{border:0;background:none;padding:8px 12px 10px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}

.wrap{max-width:46rem;margin:0 auto;padding-inline:16px;padding-block:18px 64px;display:flex;flex-direction:column;gap:16px}
.loading{color:var(--muted);text-align:center;padding:40px 0}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:20px 18px;display:flex;flex-direction:column;gap:22px;min-width:0}
.banner{border:1px solid var(--gold);background:var(--gold-soft);border-radius:4px;padding:10px 14px;font-size:.88rem}

h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.35rem}
h3{font-size:1.02rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* day head */
.dhead{display:flex;flex-direction:column;gap:8px}
.wd{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.wd li{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:600;color:var(--muted);border:1px solid transparent}
.wd li.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.date{font-size:1.6rem;line-height:1.2}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.75rem;font-weight:600;background:var(--accent-soft);color:var(--accent)}
.chip.locked{background:var(--rule);color:var(--muted)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.quote{margin:0;padding:10px 0 0;border-top:1px solid var(--rule)}
.quote p{font-family:var(--f-display);font-style:italic;font-size:1rem}
.quote cite{font-style:normal;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.daynav{display:flex;gap:6px;align-items:center}

/* numbered sections */
.sec{display:grid;grid-template-columns:30px minmax(0,1fr);gap:4px 10px}
.num{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:.78rem;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.sec.eve .num{border-color:var(--gold);color:var(--gold)}
.sec-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.sec-h h3 small{font-family:var(--f-body);font-weight:500;font-size:.8rem;color:var(--muted);margin-left:6px}
.part{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0 2px;border-top:1px dashed var(--line)}
.part:first-of-type{border-top:0}

input.line,select.line{width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:7px 2px;font-size:16px;border-radius:0;min-width:0}
input.line:focus{border-bottom-color:var(--accent);outline:none}
select.line{padding:6px 2px;color:var(--ink)}
textarea.lined{width:100%;border:0;resize:vertical;font-size:16px;line-height:32px;padding:0 2px;min-height:96px;background-color:transparent;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);background-attachment:local}
textarea.lined:focus{outline:none;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--accent-soft) 31px,var(--accent-soft) 32px)}
:disabled{opacity:1}
input:disabled,textarea:disabled,select:disabled{color:var(--ink);-webkit-text-fill-color:var(--ink)}
/* Example sentences are hints only: light and italic while writing, invisible on locked (saved) pages. */
input::placeholder,textarea::placeholder{color:var(--muted);-webkit-text-fill-color:var(--muted);opacity:.6;font-style:italic}
input:disabled::placeholder,textarea:disabled::placeholder{color:transparent;-webkit-text-fill-color:transparent}

.item{display:flex;align-items:center;gap:8px;min-width:0}
.item input[type=checkbox]{flex:none}
.item.done input.line{text-decoration:line-through;color:var(--muted);-webkit-text-fill-color:var(--muted)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);margin:0}
.carried{flex:none;font-size:.72rem;font-weight:700;color:var(--gold);background:var(--gold-soft);border-radius:999px;padding:1px 7px;font-variant-numeric:tabular-nums}
.x{flex:none;border:0;background:none;color:var(--muted);font-size:1.2rem;width:28px;height:28px;cursor:pointer;border-radius:50%}
.x:hover{background:var(--rule)}
.focus-box{border:1.5px solid var(--accent);border-radius:4px;padding:6px 10px 10px;display:flex;flex-direction:column;gap:6px}
.focus-box .item input.line{font-weight:600;border-bottom:0}
.tags{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tags label{display:flex;flex-direction:column;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;min-width:0}

.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--sheet);cursor:pointer;font-weight:700;font-variant-numeric:tabular-nums}
.rating button[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--sheet)}
.habits{display:flex;flex-direction:column;gap:6px}
.habits label{display:flex;gap:10px;align-items:center}

.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:10px 16px;border-radius:4px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.sec2{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:var(--bad);color:var(--sheet)}
.ghost{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:6px 12px;cursor:pointer;font-weight:600;min-width:38px}
.ghost:disabled{opacity:.4;cursor:default}
.ghost.small{font-size:.85rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.finish{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.confirm{background:var(--accent-soft);border-radius:4px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.help-toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.86rem}
.help-toc a{color:var(--accent);text-decoration:none;font-weight:600}
.help-toc a:hover{text-decoration:underline}
details.help{border-top:1px solid var(--rule);padding:10px 0}
details.help summary{font-family:var(--f-display);font-size:1.05rem;font-weight:600;cursor:pointer;list-style-position:outside}
.help-b{padding-top:8px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.help-b ul,.help-b ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.help-b code{background:var(--paper);padding:1px 5px;border-radius:3px;font-size:.88em;word-break:break-word}
.faq{margin:0;display:flex;flex-direction:column;gap:4px}
.faq dt{font-weight:600;margin-top:6px}
.faq dd{margin:0 0 0 0;color:var(--muted)}
.mcal{display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-head,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-head span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:center;padding:2px 0}
.cal-cell{min-height:76px;border:1px solid var(--rule);border-radius:4px;background:var(--sheet);padding:5px 6px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;cursor:pointer;text-align:left;min-width:0;font:inherit;color:inherit}
.cal-cell:hover{border-color:var(--accent);background:var(--accent-soft)}
.cal-cell.blank{border:0;background:transparent;cursor:default}
.cal-cell.today{border:2px solid var(--accent)}
.cal-cell.future .cal-n{color:var(--muted)}
.cal-n{font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.cal-cell .sc{font-size:.78rem;padding:1px 6px}
.cal-empty{font-size:.7rem;color:var(--muted)}
.cal-focus{font-size:.7rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
@media (max-width:560px){.cal-cell{min-height:54px;padding:4px}.cal-focus{display:none}.cal-head,.cal-grid{gap:3px}}
.editbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--paper)}
.editbar.editing{border-color:var(--gold);background:var(--gold-soft)}
.editbar>div{min-width:0;flex:1 1 16rem}
.flash{margin:0;padding:8px 14px;border-radius:4px;background:var(--good-soft);color:var(--good);font-weight:600;font-size:.9rem}
.score-line{display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.score-line strong{font-family:var(--f-display);font-size:1.6rem}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:10px 0}

/* week */
.cal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.cal label{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal textarea.lined{min-height:64px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 6px;text-align:center;border-bottom:1px solid var(--rule);font-size:.88rem}
th:first-child,td:first-child{text-align:left}
th{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
td.today-col,th.today-col{background:var(--accent-soft)}
.wfocus{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.wfocus li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.wfocus li span:first-child{font-weight:700;color:var(--muted);font-size:.8rem}

/* values */
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer}
.vchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vchip.star[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--sheet)}
.vchip:disabled{opacity:.4;cursor:default}
.pairs{display:flex;flex-direction:column;gap:6px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pair button{border:1px solid var(--line);background:var(--sheet);border-radius:4px;padding:8px;cursor:pointer;font-size:.88rem;min-width:0}
.pair button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.pair span{font-size:.75rem;color:var(--muted)}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--rule)}
.rank .n{font-family:var(--f-display);font-weight:700;font-size:1.1rem;color:var(--accent)}
.week-goals{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.week-goals .label{width:100%}
.ai-chat{display:flex;flex-direction:column;gap:12px}
.ai-msg{border-radius:6px;padding:10px 14px;max-width:100%;min-width:0;overflow-wrap:anywhere}
.ai-msg.user{background:var(--accent-soft);align-self:flex-end;max-width:85%;white-space:pre-wrap}
.ai-msg.ai{background:var(--paper);border:1px solid var(--rule)}
.ai-actions{border:1px solid var(--gold);background:var(--gold-soft);border-radius:6px;padding:10px 14px;display:flex;flex-direction:column;gap:6px}
.ai-actions label{display:flex;gap:8px;align-items:flex-start}
.ai-quick{display:flex;flex-wrap:wrap;gap:6px}
textarea.box{width:100%;min-height:90px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);padding:10px;font-size:16px;resize:vertical}
.order-btns{display:inline-flex;gap:2px;margin-left:6px;vertical-align:middle}
.order-btns .x{width:26px;height:26px;font-size:.95rem}
.order-btns .x:disabled{opacity:.3;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:var(--sheet);padding:5px 9px;font-size:.78rem;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.area-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.area-grid label{display:flex;flex-direction:column;gap:2px;min-width:0}
.area-grid .q{font-size:.8rem;color:var(--muted)}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{display:flex;flex-direction:column;gap:2px;padding:10px 0;border-top:2px solid var(--accent)}
.kpi strong{font-family:var(--f-display);font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi span{font-size:.78rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--rule);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .b-good{fill:var(--accent)}
.chart .b-mid{fill:var(--gold)}
.chart .b-low{fill:var(--bad)}
.chart .miss{fill:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbar{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) 3.2rem;gap:10px;align-items:center;font-size:.88rem;padding:4px 0}
.hbar .track{height:10px;background:var(--rule);border-radius:2px;overflow:hidden}
.hbar .fill{height:100%;background:var(--accent);border-radius:2px}
.hbar .fill.warnf{background:var(--bad)}
.hbar b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.insights{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.insights li.bad::marker{color:var(--bad)}
.insights li.good::marker{color:var(--good)}
.dots{display:inline-flex;gap:3px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--rule)}
.dots i.on{background:var(--accent)}
.ai-out{font-size:.95rem;display:flex;flex-direction:column;gap:8px;max-width:65ch}
.ai-out h4{font-family:var(--f-display);font-size:1.02rem;margin:8px 0 0}
.ai-out ul,.ai-out ol{margin:0;padding-left:20px}
.err{color:var(--bad);font-size:.88rem}
details summary{cursor:pointer;font-weight:600}

/* history */
.month{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 4px;border:0;border-bottom:1px solid var(--rule);background:none;text-align:left;cursor:pointer;width:100%}
.hrow:hover{background:var(--accent-soft)}
.hrow .d{font-weight:700;font-variant-numeric:tabular-nums}
.hrow .d small{display:block;font-weight:500;color:var(--muted);font-size:.75rem}
.hrow .f{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-variant-numeric:tabular-nums;font-weight:700;border-radius:4px;padding:2px 8px;font-size:.82rem}
.sc.g{background:var(--accent-soft);color:var(--accent)} .sc.m{background:var(--gold-soft);color:var(--gold)} .sc.l{background:var(--bad-soft);color:var(--bad)}
textarea.code{width:100%;min-height:140px;font-family:ui-monospace,Consolas,monospace;font-size:12px;border:1px solid var(--line);background:var(--paper);padding:8px}

@media (max-width:560px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .area-grid,.cal{grid-template-columns:minmax(0,1fr)}
  .tags{grid-template-columns:minmax(0,1fr)}
  .sheet{padding:16px 14px}
  .date{font-size:1.35rem}
  .hbar{grid-template-columns:minmax(0,6.5rem) minmax(0,1fr) 3rem}
}
/* Intro: a dialog with an animated stage per scene. Base styles are each scene's final picture; the keyframes animate towards it. */
body.intro-open{overflow:hidden}
.intro{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,16,26,.55);backdrop-filter:blur(3px)}
.intro-card{width:min(34rem,100%);max-height:100%;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.intro-card>*{flex:none}
.intro-bars{display:flex;gap:4px}
.intro-bars i{flex:1;height:3px;border-radius:2px;background:var(--rule);overflow:hidden}
.intro-bars i.done{background:var(--accent)}
.intro-fill{display:block;height:100%;background:var(--accent);transform-origin:left;animation:i-fill var(--dur) linear both}
.intro-stage{background:var(--accent-soft);border-radius:8px;overflow:hidden}
.intro-stage svg{display:block;width:100%;height:auto;max-height:44vh}
.intro-text{display:flex;flex-direction:column;gap:4px;min-height:8.5rem}

  const wk=1+Math.round(((d-w1)/864e5-3+((w1.getDay()+6)%7))/7);return `${d.getFullYear()}-W${pad(wk)}`;}

const IDB={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('smj6',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);});}catch(e){return null}},

};

/* ---------- state ---------- */
const S={days:new Map(),weeks:new Map(),meta:new Map(),reviews:new Map(),tab:'calendar',cur:null,calMonth:null,loadingDay:null,dayMsg:'',weekMon:null,
  unlocked:new Set(),range:30,confirm:false,restore:null,restoreMsg:'',
  backupMsg:'',copyText:'',date:null,dir:null,savedDir:null,connectMsg:'',needLogin:false,flash:'',aiChat:[],aiBusy:false,aiCtl:null,aiForm:null,aiModels:[],aiMsg:'',aiGuideMsg:'',aiCopyText:'',aiDraft:'',base:new Map(),sub:'',lastSync:0,syncing:false,syncMsg:'',folderMsg:'',settings:null,settingsMsg:''};

/* ---------- models ---------- */
const arr=(a,n,f)=>{a=Array.isArray(a)?a.slice():[];while(a.length<n)a.push(typeof f==='function'?f():f);return a;};
const todo=()=>({text:'',done:false,carried:0});
function newDay(date){return normDay({date,status:'open',createdAt:Date.now()});}
function normDay(d){

  d.focus={text:'',done:false,area:'',value:'',carried:0,...(d.focus||{})};
  d.cream=arr(d.cream,2,todo); d.cherries=Array.isArray(d.cherries)?d.cherries:[];
  d.relax=Array.isArray(d.relax)&&d.relax.length?d.relax:[{text:'',done:false}];

  d.evening={win:'',moment:'',learned:'',rating:0,...(d.evening||{})};
  if(!d.habits||typeof d.habits!=='object') d.habits={};
  if(!d.status) d.status='open';

}
function newWeek(id,monday){return{id,monday,goals:[],cal:{mon:'',tue:'',wed:'',thu:'',fri:'',wkd:''},notes:'',wins:'',reflection:{well:'',change:'',rating:0}};}
function normWeek(w){w.goals=Array.isArray(w.goals)?w.goals.filter(g=>g&&typeof g==='object').map(g=>({text:'',done:false,...g})):[];
  w.cal={mon:'',tue:'',wed:'',thu:'',fri:'',wkd:'',...(w.cal||{})};w.notes??='';w.wins??='';w.reflection={well:'',change:'',rating:0,...(w.reflection||{})};return w;}
function profile(){
  let p=S.meta.get('profile'); if(!p){p={};S.meta.set('profile',p);}
  p.vision=p.vision||{}; p.vision.horizon=p.vision.horizon||'5 years'; p.vision.date=p.vision.date||''; p.vision.areas=p.vision.areas||{};
  // Values compass: up to 8 chosen values in the user's own order; status "well" (on course) or "more" (needs attention).
  const v=p.values=p.values||{}; v.order=Array.isArray(v.order)?v.order:[]; v.status=v.status||{}; v.notes=v.notes||{}; v.custom=v.custom||[];
  // Profiles from the earlier version: turn the old ranking (top five plus pair results) into the new order once.
  if(!v.order.length&&Array.isArray(v.top)&&v.top.length){
    const wins={};v.top.forEach(x=>wins[x]=0);
    for(const w of Object.values(v.pairs||{})) if(w in wins) wins[w]++;
    v.order=v.top.slice().sort((a,b)=>wins[b]-wins[a]).slice(0,MAX_VALUES);
    for(const [name,a] of Object.entries(v.answers||{})) if(a&&filled(a.change)&&!v.notes[name]) v.notes[name]=a.change;
  }
  delete v.top; delete v.pairs; delete v.selected; delete v.focus; delete v.answers;
  p.habits=Array.isArray(p.habits)?p.habits:[];
  return p;
}
const MAX_VALUES=8;
function rankedValues(){return profile().values.order.map(name=>({name}));}

/* ---------- storage ---------- */
let store=null;
/* Folder layout: data/<collection>/<id>.json (machine data) and pages/<yyyymmdd>-Journal-Day Page-v1.md (readable copy) */
// Inside the Windows app the host program exposes file access as chrome.webview.hostObjects.journal.
const NATIVE=(window.chrome&&window.chrome.webview&&window.chrome.webview.hostObjects)?window.chrome.webview.hostObjects.journal:null;

/* ---------- web app: Microsoft sign-in + OneDrive app folder ----------
   Used when the page is served over https (GitHub Pages) and a client ID is configured.
   Each user's journal lives in their own OneDrive at Apps/<app name>/, same layout as the Windows app folder. */
const APP_VERSION='Daykeel 1.2 Intro (2026-10-27)';
// OneDrive names the app folder after the app registration ("Daykeel").
const APP_FOLDER_LABEL='OneDrive › Apps › Daykeel';
const CLOUD={clientId:'8b0e5366-6e9a-48c1-930b-9553783f2e0b',authority:'https://login.microsoftonline.com/common/oauth2/v2.0',
  scopes:'openid profile offline_access Files.ReadWrite.AppFolder'};
// CLOUD_AVAILABLE: this page can use Microsoft sign-in. CLOUD_MODE: this device currently uses it.
// On a PC, Settings can switch the device to a folder chosen in the Windows folder window (stored per device).
const CLOUD_AVAILABLE=!NATIVE&&location.protocol==='https:'&&!CLOUD.clientId.startsWith('__');
const PICKER=('showDirectoryPicker' in window);
let CLOUD_MODE=CLOUD_AVAILABLE&&!(PICKER&&(()=>{try{return localStorage.getItem('smj6:mode')==='folder';}catch(e){return false;}})());
const REDIRECT=location.origin+location.pathname.replace(/index\.html$/,'');
const b64url=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const randomStr=n=>b64url(crypto.getRandomValues(new Uint8Array(n)));
const Auth={
  t:null,
  load(){try{this.t=JSON.parse(localStorage.getItem('smj6:auth')||'null');}catch(e){this.t=null;}},
  save(){try{this.t?localStorage.setItem('smj6:auth',JSON.stringify(this.t)):localStorage.removeItem('smj6:auth');}catch(e){}},
  get user(){return this.t&&this.t.user||null;},
  async login(prompt){
    const verifier=randomStr(48), state=randomStr(16);
    const challenge=b64url(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)));
    try{sessionStorage.setItem('smj6:pkce',JSON.stringify({verifier,state}));}catch(e){}
    const q=new URLSearchParams({client_id:CLOUD.clientId,response_type:'code',redirect_uri:REDIRECT,response_mode:'query',
      scope:CLOUD.scopes,code_challenge:challenge,code_challenge_method:'S256',state});
    if(prompt) q.set('prompt',prompt);
    if(this.user&&this.user.username) q.set('login_hint',this.user.username);
    location.assign(`${CLOUD.authority}/authorize?${q}`);
  },
  async redeem(body){
    const r=await fetch(`${CLOUD.authority}/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:new URLSearchParams({client_id:CLOUD.clientId,scope:CLOUD.scopes,...body})});
    const j=await r.json();
    if(!r.ok) throw Object.assign(new Error(j.error_description||j.error||'token error'),{code:j.error});
    let user=this.user;
    if(j.id_token){try{const c=JSON.parse(decodeURIComponent(escape(atob(j.id_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));user={name:c.name||'',username:c.preferred_username||''};}catch(e){}}
    this.t={access:j.access_token,refresh:j.refresh_token||(this.t&&this.t.refresh),exp:Date.now()+(j.expires_in-60)*1000,user};
    this.save();
  },
  // Returns 'ok', 'login' (interaction needed) or 'none' (no redirect in the URL).
  async handleRedirect(){
    const p=new URLSearchParams(location.search);
    if(!p.has('code')&&!p.has('error')) return 'none';
    history.replaceState(null,'',REDIRECT);
    if(p.has('error')) return 'login';
    let saved={};try{saved=JSON.parse(sessionStorage.getItem('smj6:pkce')||'{}');sessionStorage.removeItem('smj6:pkce');}catch(e){}
    if(!saved.state||saved.state!==p.get('state')) return 'login';
    await this.redeem({grant_type:'authorization_code',code:p.get('code'),redirect_uri:REDIRECT,code_verifier:saved.verifier});
    return 'ok';
  },
  async token(){
    if(this.t&&this.t.access&&Date.now()<this.t.exp) return this.t.access;
    if(this.t&&this.t.refresh){try{await this.redeem({grant_type:'refresh_token',refresh_token:this.t.refresh});return this.t.access;}catch(e){}}
    return null;
  },
  signOut(){this.t=null;this.save();try{localStorage.removeItem('smj6:gcache');}catch(e){}
    location.assign(`${CLOUD.authority}/logout?post_logout_redirect_uri=${encodeURIComponent(REDIRECT)}`);}
};
async function graph(path,opts={}){
  const tok=await Auth.token();
  if(!tok){S.needLogin=true;throw Object.assign(new Error('Sign-in expired'),{code:'auth'});}
  const r=await fetch('https://graph.microsoft.com/v1.0'+path,{...opts,headers:{Authorization:'Bearer '+tok,...(opts.headers||{})}});
  if(r.status===401){Auth.t.exp=0;Auth.save();}
  return r;
}
async function pool(items,n,fn){let i=0;await Promise.all([...Array(Math.min(n,items.length))].map(async()=>{while(i<items.length){const it=items[i++];await fn(it);}}));}
function graphStore(){
  const enc=p=>p.split('/').map(encodeURIComponent).join('/');
  const root='/me/drive/special/approot:/'+(S.sub?enc(S.sub)+'/':'');
  const cacheKey='smj6:gcache'+(S.sub?':'+S.sub:'');
  let cache={};try{cache=JSON.parse(localStorage.getItem(cacheKey)||'{}');}catch(e){}
  const keep=()=>{try{localStorage.setItem(cacheKey,JSON.stringify(cache));}catch(e){}};
  // Conditional write. etag given: only if the file is still that version (If-Match).
  // etag null: only if the file does not exist yet. force: unconditional (restore from backup).
  async function put(rel,text,etag,force){
    let url=`${root}${enc(rel)}:/content`; const headers={'Content-Type':'text/plain'};
    if(!force){if(etag) headers['If-Match']=etag; else url+='?@microsoft.graph.conflictBehavior=fail';}
    const r=await graph(url,{method:'PUT',headers,body:text});
    if(r.status===412||r.status===409) throw Object.assign(new Error('Changed on another device'),{code:'conflict'});
    if(!r.ok) throw new Error('OneDrive save failed ('+r.status+')');
    return r.json();
  }
  // Downloads a file's text. First via the item's temporary download link; if the browser cannot use that link
  // (some work accounts block it), through Microsoft Graph itself. A failed download throws, it is never "no page".
  async function download(item){
    let why='';
    if(item['@microsoft.graph.downloadUrl']){
      try{const r=await fetch(item['@microsoft.graph.downloadUrl']);if(r.ok) return r.text();why='link '+r.status;}
      catch(e){why='link blocked';}
    }
    try{const r=await graph(`/me/drive/items/${encodeURIComponent(item.id)}/content`);if(r.ok) return r.text();why+=', graph '+r.status;}
    catch(e){if(e&&e.code==='auth') throw e;why+=', graph blocked';}
    throw new Error('OneDrive download failed ('+why+')');
  }
  return{

  const cache={};

    let h=root;for(const p of path.split('/')) h=await h.getDirectoryHandle(p,{create:true});
    return (cache[path]=h);

    async all(c){const d=await dir('data/'+c);const out=[];

const saveQ={};
function scheduleSave(col,id,delay=700){

async function flush(col,id){

  q.inflight=true; q.dirty=false;
  try{
    let merged=false;
    for(let attempt=0;;attempt++){
      const data=S[col].get(id); data.updatedAt=Date.now();
      const snapshot=JSON.parse(JSON.stringify(data)), base=S.base.get(k);
      try{
        const res=await store.set(col,id,snapshot,base?base.etag:null);
        S.base.set(k,{etag:res&&res.etag||null,data:snapshot});
        break;
      }catch(e){

        // Another device saved this file first: combine both versions, then save again with the new version tag.
        const remote=await store.get(col,id);

        const current=S[col].get(id);

        if(col==='days') normDay(result); if(col==='weeks') normWeek(result);
        S[col].set(id,result);
        if(remote){const rb=JSON.parse(JSON.stringify(remote.data));if(col==='days')normDay(rb);if(col==='weeks')normWeek(rb);S.base.set(k,{etag:remote.etag,data:rb});}

function carry(from,to){
  if(from.carriedTo) return;
  const have=new Set([to.focus.text,...to.cream.map(t=>t.text),...to.cherries.map(t=>t.text)].map(s=>String(s).trim().toLowerCase()).filter(Boolean));
  const items=[];

  for(const t of [...from.cream,...from.cherries]) if(filled(t.text)&&!t.done) items.push({text:t.text,carried:(t.carried||0)+1});
  for(const it of items){
    if(have.has(it.text.trim().toLowerCase())) continue;
    if(it.focus&&!filled(to.focus.text)){Object.assign(to.focus,{text:it.text,done:false,carried:it.carried,area:it.area||'',value:it.value||''});continue;}
    const t={text:it.text,done:false,carried:it.carried};

/* ---------- scoring & analysis ---------- */
function dayStats(d,habits){

  const cream=d.cream.filter(t=>filled(t.text));
  const relax=d.relax.filter(t=>filled(t.text));

  const morning=filled(d.focus.text)||d.grateful.some(filled)||cream.length>0;

    relax:relax.length,relaxDone:relax.filter(t=>t.done).length,hDone,hTotal:habits.length,rating:ev.rating||0,

  const top=r.areas.slice().sort((a,b)=>b.n-a.n)[0]; if(top&&top.n) out.push(['good',`Most of your keel tasks served ${top.name} (${top.n} day${top.n===1?'':'s'}).`]);
  const more=r.values.filter(v=>v.more);
  for(const v of more) out.push([v.n?'good':'bad',`"${v.name}" needs attention. ${v.n?`${v.n} keel task${v.n===1?' was':'s were'} tagged with it.`:'No keel task was tagged with it yet.'}`]);
  for(const [t,n] of r.chronic.slice(0,3)) out.push(['bad',`"${t}" has moved forward ${n} times. Do it first tomorrow, delegate it, or drop it.`]);
  for(const h of r.habits) if(h.rate!=null&&h.rate<50) out.push(['bad',`Habit "${h.name}" was done on ${h.rate}% of journaled days.`]);
  return out;
}

function render(){
  pendingRender=false;
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===S.tab?'page':'false'));
  const v=S.tab, m=$('#main');
  if(v==='help'){m.innerHTML=viewHelp();return;} // Help works before signing in too
  if(!store){m.innerHTML=viewConnect();return;}
  m.innerHTML=(v==='week'?viewWeek():v==='me'?viewMe():v==='history'?viewHistory():v==='progress'?viewProgress():v==='settings'?viewSettings():v==='calendar'?viewCalendar():v==='ai'?viewAI():viewDay());
}

function relLabel(date){const t=S.date;return date===t?'Today':date===addDays(t,1)?'Tomorrow':date===addDays(t,-1)?'Yesterday':'';}

function viewDay(){

  const valOpts=rankedValues().map(v=>v.name);

  const s=dayStats(d,p.habits);

  const edited=d.editedAt?`<span class="small muted">Last changed after archiving: ${esc(new Date(d.editedAt).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}.</span>`:'';
  const editBar=!arch?'':locked
    ?`<div class="editbar"><div><strong>This page is archived.</strong> ${edited||'<span class="small muted">You can still correct or complete it.</span>'}</div><button class="btn sec2" data-act="unlock">Edit page</button></div>`
    :`<div class="editbar editing"><div><strong>Editing an archived page.</strong> <span class="small muted">Changes save automatically; click Save when you are done.</span></div><button class="btn" data-act="lock">Save</button></div>`;

    <label>Value it serves<select class="line" ${b('focus.value')} ${dis}><option value="">Not tagged</option>${valOpts.map(v=>`<option ${d.focus.value===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label></div></div>

    ${locked?'':`<button class="linkbtn" data-act="add" data-list="cherries">+ Add task</button>`}`);

  html+=sec(5,'Bright spot','something to look forward to',d.forward.map((g,i)=>line(`forward.${i}`,g,i===0?'Something today that I will enjoy':'…','Bright spot '+(i+1))).join(''));

    :`<p class="small muted">No habits yet.</p><button class="linkbtn" data-act="tab" data-tab="me" data-anchor="habits">Add habits to track</button>`,true);

  else if(arch) html+=`<div class="row"><button class="btn" data-act="lock">Save</button><span class="small muted">Saves your changes and locks the page again.</span></div>`;
  html+=`</div></article>`;
  return html;
}

    <div class="row"><input class="line" style="max-width:20rem" type="text" id="newHabit" placeholder="New habit" aria-label="New habit"><button class="ghost small" data-act="hadd">Add habit</button></div></article>`;
  return h;
}

function viewHistory(){
  const p=profile(); const dates=[...S.days.keys()].sort().reverse();
  const groups={};for(const d of dates){const k=d.slice(0,7);(groups[k]=groups[k]||[]).push(d);}
  let h=banner()+`<article class="sheet"><div class="dhead"><span class="label">Archive</span><h1 class="date">All pages</h1><p class="muted">${dates.length} page${dates.length===1?'':'s'} written. Tap a day to open it.</p></div>`;
  for(const [k,ds] of Object.entries(groups)){
    h+=`<div class="month"><span class="label" style="padding:8px 0">${esc(parse(k+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'}))}</span>${ds.map(d=>{const doc=S.days.get(d),s=dayStats(doc,p.habits);
      const cls=!s.journaled?'':s.score>=70?'g':s.score>=40?'m':'l';
      return `<button class="hrow" data-act="open-day" data-date="${d}"><span class="d">${esc(fmtShort(d))}<small>${esc(parse(d).toLocaleDateString('en-GB',{weekday:'short'}))}</small></span>
        <span class="f">${filled(doc.focus.text)?(doc.focus.done?'✓ ':'')+esc(doc.focus.text):'<span class="muted">No keel task</span>'}</span>
        ${s.journaled?`<span class="sc ${cls}">${s.score}</span>`:'<span class="small muted">empty</span>'}</button>`;}).join('')}</div>`;
  }
  h+=`</article>`;
  h+=`<article class="sheet"><div class="dhead"><span class="label">Backup</span><h1 class="date">Snapshots &amp; import</h1>
    <p class="muted">A snapshot puts the whole journal into one file in <code>backups</code>. Import loads a snapshot or a backup from an earlier version. The folder and sync settings are in <button class="linkbtn" data-act="tab" data-tab="settings">Settings</button>.</p></div>
    <div class="row"><button class="btn" data-act="backup">Save snapshot</button><label class="ghost small" style="display:inline-flex;align-items:center;cursor:pointer">Import from file<input type="file" id="restoreFile" accept=".json,application/json" hidden></label></div>
    ${S.backupMsg?`<p class="small">${esc(S.backupMsg)}</p>`:''}
    ${S.restore?`<div class="confirm"><p>Backup from ${esc(S.restore.at||'unknown date')} with ${S.restore.counts}. Pages with the same date are replaced by the backup version. Other pages stay.</p><div class="row"><button class="btn danger" data-act="restore-yes">Restore backup</button><button class="ghost" data-act="restore-no">Cancel</button></div></div>`:''}
    ${S.restoreMsg?`<p class="small">${esc(S.restoreMsg)}</p>`:''}</article>`;
  return h;
}

// Start page: month calendar (Monday first). Each saved day shows its day score; clicking a day opens it.
function viewCalendar(){
  const m=S.calMonth||S.date.slice(0,7), [y,mo]=m.split('-').map(Number), p=profile();
  const lead=(new Date(y,mo-1,1).getDay()+6)%7, daysIn=new Date(y,mo,0).getDate();
  const title=new Date(y,mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  let cells='', written=0, scoreSum=0, focusDone=0;
  for(let i=0;i<lead;i++) cells+='<span class="cal-cell blank" aria-hidden="true"></span>';
  for(let day=1;day<=daysIn;day++){
    const date=`${y}-${pad(mo)}-${pad(day)}`, doc=S.days.get(date), s=doc?dayStats(doc,p.habits):null;
    const cls=['cal-cell',date===S.date?'today':'',date>S.date?'future':'',doc?'has':''].join(' ');
    let badge='', label=fmtLong(date);
    if(s&&s.journaled){written++;scoreSum+=s.score;if(s.focusDone)focusDone++;
      badge=`<span class="sc ${s.score>=70?'g':s.score>=40?'m':'l'}">${s.score}</span>`;label+=`, score ${s.score}`;}
    else if(doc){badge='<span class="cal-empty">page</span>';label+=', empty page';}
    else label+=', no page';
    cells+=`<button class="${cls}" data-act="open-day" data-date="${date}" aria-label="${esc(label)}"><span class="cal-n">${day}</span>${badge}${doc&&filled(doc.focus.text)?`<span class="cal-focus">${doc.focus.done?'✓ ':''}${esc(doc.focus.text)}</span>`:''}</button>`;
  }
  const isNow=m===S.date.slice(0,7);
  return banner()+`<article class="sheet"><div class="dhead"><div class="drow"><span class="label">Calendar</span>
    <div class="daynav"><button class="ghost" data-act="cal-go" data-d="-1" aria-label="Previous month">‹</button><button class="ghost small" data-act="cal-now" ${isNow?'disabled':''}>This month</button><button class="ghost" data-act="cal-go" data-d="1" aria-label="Next month">›</button></div></div>
    <h1 class="date">${esc(title)}</h1>
    <p class="muted">${written?`${written} day${written===1?'':'s'} written · average score ${Math.round(scoreSum/written)} · keel task done on ${focusDone} day${focusDone===1?'':'s'}.`:'No pages written this month yet.'} Click a day to open or create its page.</p></div>
    <div class="mcal"><div class="cal-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-grid">${cells}</div></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>score 70 and above</span><span><i style="background:var(--gold)"></i>40 to 69</span><span><i style="background:var(--bad)"></i>below 40</span><span><i style="border:2px solid var(--accent);background:transparent"></i>today</span></div>
    ${isNow?`<div class="row"><button class="btn" data-act="open-day" data-date="${S.date}">Open today</button></div>`:''}</article>`;
}

  ['files','12. Your files and privacy',`

// AI tab: the in-app assistant (own key) and the connection for outside AIs.
function viewAI(){
  const c=aiCfg(), ready=aiReady();
  let h=banner()+`<article class="sheet"><div class="dhead"><span class="label">AI helper</span><h1 class="date">Plan and reflect with your AI</h1>
    <p class="muted">${ready?`Connected to <strong>${esc(AI_PROVIDERS[c.provider].label)}</strong>, model <code>${esc(c.model)}</code>. Each question sends your heading, values, habits, this week's goals and your last 14 days to that provider, using your own key. Nothing changes in Daykeel until you confirm.`
      :'Connect the AI of your choice (Claude, ChatGPT, Gemini or another) with your own key, then ask for help with planning, goals and reviews.'}</p></div>`;
  if(!ready) h+=`<div class="row"><button class="btn" data-act="tab" data-tab="settings" data-anchor="ai-settings">Connect an AI</button></div>`;
  else{
    const quick=[['Plan my week','Look at my weekly goals, values and the last days, and propose a keel task for each remaining day of this week.'],
      ['Suggest today\'s keel task','Suggest one keel task for today, plus two next-up tasks, based on my weekly goals and recent days.'],
      ['Turn goals into a plan','I will paste my goals below. Add them as weekly goals for this week and suggest which day to tackle each one.'],
      ['Review my last 7 days','Review my last 7 days: what went well, what slipped, and three small actions for next week.']];
    h+=`<div class="ai-quick">${quick.map(([l,q])=>`<button class="vchip" data-act="ai-quick" data-q="${esc(q)}" ${S.aiBusy?'disabled':''}>${esc(l)}</button>`).join('')}</div>
      <div class="ai-chat" id="aiChat">${S.aiChat.map((m,idx)=>{
        if(m.role==='user') return `<div class="ai-msg user">${esc(m.content)}</div>`;
        if(m.error) return `<div class="ai-msg ai"><p class="err">${esc(m.error)}</p></div>`;
        const shown=m.content.replace(/```daykeel-actions[\s\S]*?```/g,'').trim();
        let acts='';
        if(m.actions&&m.actions.length) acts=m.applied!=null?`<p class="flash">Applied ${m.applied} change${m.applied===1?'':'s'}.</p>`
          :`<div class="ai-actions"><strong>Suggested changes</strong>${m.actions.map((x,i)=>`<label><input type="checkbox" data-aipick="${idx}" data-i="${i}" checked> <span>${esc(describeAiAction(x))}</span></label>`).join('')}
            <div class="row"><button class="btn" data-act="ai-apply" data-m="${idx}">Apply selected</button><button class="ghost small" data-act="ai-dismiss" data-m="${idx}">Dismiss</button></div></div>`;
        return `<div class="ai-msg ai"><div class="ai-out">${md(shown||'(No text, only suggested changes.)')}</div>${acts}</div>`;}).join('')}
      ${S.aiBusy?`<div class="ai-msg ai"><p class="muted">Thinking… <button class="linkbtn" data-act="ai-stop">Stop</button></p></div>`:''}</div>
      <textarea class="box" id="aiInput" placeholder="Ask anything, or paste your goals or tasks (for example from Notion) and say what to do with them." aria-label="Message to the AI">${esc(S.aiDraft||'')}</textarea>
      <div class="row"><button class="btn" data-act="ai-send" ${S.aiBusy?'disabled':''}>Send</button>${S.aiChat.length?'<button class="ghost small" data-act="ai-clear">Clear conversation</button>':''}</div>`;
  }
  h+=`</article>`;
  h+=`<article class="sheet"><div class="dhead"><span class="label">Outside AI</span><h1 class="date">Use Daykeel from your own AI</h1>
    <p class="muted">If you already use an AI that can reach your OneDrive and other tools (for example Claude with the Notion and Microsoft 365 connectors), it can read and write Daykeel directly. Ask it things like <em>"Take my weekly goals from Notion and add them to Daykeel for this week."</em></p></div>
    <ol class="small" style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px">
      <li>Click <strong>Write AI guide</strong> once. It saves <code>ai/DAYKEEL-AI-GUIDE.md</code> into your Daykeel folder, explaining the files and rules to any AI.</li>
      <li>Click <strong>Copy instructions</strong>, paste them into your AI chat and add your request at the end.</li>
      <li>Come back to Daykeel; changes appear within a minute, or immediately with <em>Settings → Sync now</em>.</li></ol>
    <div class="row"><button class="btn sec2" data-act="ai-guide">Write AI guide</button><button class="ghost small" data-act="ai-copy-prompt">Copy instructions</button></div>
    ${S.aiGuideMsg?`<p class="small">${esc(S.aiGuideMsg)}</p>`:''}
    ${S.aiCopyText?`<textarea class="code" readonly id="aiCopyText">${esc(S.aiCopyText)}</textarea>`:''}</article>`;
  return h;
}

function scoreChart(days){
  const n=days.length;if(!n)return'';
  const W=Math.max(300,Math.min(680,(window.innerWidth||680)-64)),H=170,pl=30,pr=6,pt=10,pb=24,iw=W-pl-pr,ih=H-pt-pb,step=iw/n,bw=Math.max(2,Math.min(18,step*0.7));
  let g='';
  for(const v of [0,50,100]){const y=pt+ih-ih*v/100;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+4}" class="axis" text-anchor="end">${v}</text>`;}
  const every=Math.max(1,Math.ceil(n/6));
  days.forEach((x,i)=>{const cx=pl+step*i+step/2;const sc=x.s&&x.s.journaled?x.s.score:null;
    if(sc==null) g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${pt+ih-2}" width="${bw.toFixed(1)}" height="2" class="miss"><title>${fmtShort(x.date)}: no entry</title></rect>`;
    else{const hh=Math.max(2,ih*sc/100);g+=`<rect x="${(cx-bw/2).toFixed(1)}" y="${(pt+ih-hh).toFixed(1)}" width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" rx="1.5" class="${sc>=70?'b-good':sc>=40?'b-mid':'b-low'}"><title>${fmtShort(x.date)}: score ${sc}</title></rect>`;}
    if(i%every===0||i===n-1){if(i!==n-1&&n-1-i<every*0.6)return;g+=`<text x="${cx.toFixed(1)}" y="${H-6}" class="axis" text-anchor="middle">${esc(fmtShort(x.date))}</text>`;}
  });
  return `<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Daily score per day">${g}</svg>`;
}

function md(t){
  const lines=esc(t).split('\n');let out='',list=null;
  const inline=s=>s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  const close=()=>{if(list){out+=`</${list}>`;list=null;}};
  for(const raw of lines){const l=raw.trim();
    if(/^#{1,4}\s/.test(l)){close();out+=`<h4>${inline(l.replace(/^#{1,4}\s/,''))}</h4>`;}
    else if(/^[-*•]\s/.test(l)){if(list!=='ul'){close();out+='<ul>';list='ul';}out+=`<li>${inline(l.replace(/^[-*•]\s/,''))}</li>`;}
    else if(/^\d+[.)]\s/.test(l)){if(list!=='ol'){close();out+='<ol>';list='ol';}out+=`<li>${inline(l.replace(/^\d+[.)]\s/,''))}</li>`;}
    else if(!l){close();}
    else{close();out+=`<p>${inline(l)}</p>`;}}
  close();return out;
}

   Each person connects the AI provider of their choice with their own key. The key and settings are kept
   only in this browser (localStorage) and are sent only to that provider. Daykeel never runs a server. */
const AI_PROVIDERS={
  anthropic:{label:'Claude (Anthropic)',keyUrl:'https://console.anthropic.com/settings/keys',hint:'Starts with sk-ant-'},
  openai:{label:'OpenAI (ChatGPT)',keyUrl:'https://platform.openai.com/api-keys',hint:'Starts with sk-'},
  gemini:{label:'Google Gemini',keyUrl:'https://aistudio.google.com/apikey',hint:'From Google AI Studio'},

// Claude models that accept the server-side refusal fallback ("default" form).
const CLAUDE_FALLBACK_MODELS=['claude-opus-5-5','claude-opus-5','claude-fable-5-1','claude-sonnet-5-5'];
const aiCfg=()=>{try{return JSON.parse(localStorage.getItem('dk:ai')||'null');}catch(e){return null;}};
const aiReady=()=>{const c=aiCfg();return !!(c&&c.provider&&c.model&&(c.key||c.provider==='custom'));};
function aiSaveCfg(c){try{c?localStorage.setItem('dk:ai',JSON.stringify(c)):localStorage.removeItem('dk:ai');}catch(e){}}
const customBase=c=>String(c.baseUrl||'').replace(/\/+$/,'');
async function aiFetchJson(url,opts){
  let r;try{r=await fetch(url,opts);}catch(e){throw new Error('The provider could not be reached (network or browser blocked the request).');}
  let j=null;try{j=await r.json();}catch(e){}
  if(!r.ok){const m=j&&(j.error&&(j.error.message||j.error.type)||j.message);throw new Error(`${r.status}: ${m||r.statusText||'request failed'}`);}
  return j;
}
const anthropicHeaders=c=>({'x-api-key':c.key,'anthropic-version':'2026-10-21','anthropic-dangerous-direct-browser-access':'true','content-type':'application/json'});
// Lists the models this key can use, so nobody has to type (or guess) model names.
async function aiListModels(c){
  if(c.provider==='anthropic'){const j=await aiFetchJson('https://api.anthropic.com/v1/models?limit=100',{headers:anthropicHeaders(c)});return (j.data||[]).map(m=>m.id);}
  if(c.provider==='openai'){const j=await aiFetchJson('https://api.openai.com/v1/models',{headers:{Authorization:'Bearer '+c.key}});return (j.data||[]).map(m=>m.id).sort();}
  if(c.provider==='gemini'){const j=await aiFetchJson(`https://generativelanguage.googleapis.com/v1beta/models?pageSize=200&key=${encodeURIComponent(c.key)}`,{});
    return (j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace(/^models\//,''));}
  const j=await aiFetchJson(customBase(c)+'/models',{headers:c.key?{Authorization:'Bearer '+c.key}:{}});return (j.data||[]).map(m=>m.id).sort();
}
// One chat turn. messages: [{role:'user'|'assistant', content}]. Returns the reply text.
async function aiChat(c,system,messages,signal){
  if(c.provider==='anthropic'){
    const body={model:c.model,max_tokens:16000,system,messages};const headers=anthropicHeaders(c);
    if(CLAUDE_FALLBACK_MODELS.includes(c.model)){body.fallbacks='default';headers['anthropic-beta']='server-side-fallback-2026-07-01';}
    const j=await aiFetchJson('https://api.anthropic.com/v1/messages',{method:'POST',headers,body:JSON.stringify(body),signal});
    if(j.stop_reason==='refusal') throw new Error('The model declined this request. Rephrase it and try again.');
    return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n').trim();
  }
  if(c.provider==='gemini'){
    const j=await aiFetchJson(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(c.model)}:generateContent?key=${encodeURIComponent(c.key)}`,{method:'POST',headers:{'content-type':'application/json'},signal,
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:messages.map(m=>({role:m.role==='assistant'?'model':'user',parts:[{text:m.content}]}))})});
    return ((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[]).map(p=>p.text||'').join('').trim();
  }
  const base=c.provider==='openai'?'https://api.openai.com/v1':customBase(c);
  const j=await aiFetchJson(base+'/chat/completions',{method:'POST',signal,headers:{'content-type':'application/json',...(c.key?{Authorization:'Bearer '+c.key}:{})},
    body:JSON.stringify({model:c.model,messages:[{role:'system',content:system},...messages]})});
  return ((j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'').trim();
}

const AI_SYSTEM=`You are the assistant inside Daykeel, a private daily planner. Each morning the user sets one keel task (the single most important task), two next-up tasks, other tasks, recharge items, gratitude and a bright spot; each evening they log a win, a highlight, a lesson, a rating and habits. Each week has weekly goals. Users also keep a heading (where they want to be in six life areas) and a values compass.

{"type":"add_week_goal","week":"YYYY-Www","text":"..."}
{"type":"set_keel_task","date":"YYYY-MM-DD","text":"...","area":"body|career|family|attitude|finance|leisure (optional)"}
{"type":"add_task","date":"YYYY-MM-DD","text":"...","list":"next|also"}
{"type":"add_recharge","date":"YYYY-MM-DD","text":"..."}
{"type":"add_habit","name":"..."}

function parseAiActions(text){
  const out=[];const re=/```daykeel-actions\s*([\s\S]*?)```/g;let m;
  while((m=re.exec(text))){try{const a=JSON.parse(m[1]);if(Array.isArray(a)) for(const x of a) if(x&&typeof x==='object'&&typeof x.type==='string') out.push(x);}catch(e){}}
  const ok={add_week_goal:x=>/^\d{4}-W\d{2}$/.test(x.week)&&filled(x.text),set_keel_task:x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&filled(x.text),
    add_task:x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&filled(x.text),add_recharge:x=>/^\d{4}-\d{2}-\d{2}$/.test(x.date)&&filled(x.text),add_habit:x=>filled(x.name)};
  return out.filter(x=>ok[x.type]&&ok[x.type](x)).map(x=>({...x,text:x.text&&String(x.text).slice(0,300),name:x.name&&String(x.name).slice(0,120)}));
}
function describeAiAction(x){
  const day=d=>fmtShort(d)+(d===S.date?' (today)':'');
  if(x.type==='add_week_goal') return `Weekly goal for week ${x.week.split('-W')[1]}: ${x.text}`;
  if(x.type==='set_keel_task'){const cur=S.days.get(x.date);const old=cur&&filled(cur.focus.text)?` (replaces "${cur.focus.text}")`:'';return `Keel task on ${day(x.date)}: ${x.text}${old}`;}

  if(x.type==='add_recharge') return `Recharge on ${day(x.date)}: ${x.text}`;

// Applies confirmed actions through the normal, conflict-safe saving.
function applyAiAction(x){
  const ensureDay=d=>{let doc=S.days.get(d);if(!doc){doc=newDay(d);S.days.set(d,doc);}return doc;};
  if(x.type==='add_week_goal'){let w=S.weeks.get(x.week);if(!w){const [y,n]=x.week.split('-W').map(Number);const jan4=new Date(y,0,4);const mon=new Date(jan4);mon.setDate(jan4.getDate()-((jan4.getDay()+6)%7)+(n-1)*7);

    normWeek(w);if(!w.goals.some(g=>g.text.trim().toLowerCase()===x.text.trim().toLowerCase())) w.goals.push({text:x.text,done:false});scheduleSave('weeks',x.week,200);return;}
  if(x.type==='add_habit'){const p=profile();if(!p.habits.some(h=>h.name.toLowerCase()===x.name.toLowerCase())) p.habits.push({id:'h'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),name:x.name});scheduleSave('meta','profile',200);return;}

function aiGuideText(){
  return `# Daykeel: guide for AI assistants

This folder (${folderLabel()}) is a person's Daykeel journal. Read this guide before reading or writing any Daykeel file.

## Files
- \`data/days/YYYY-MM-DD.json\`: one file per day.
- \`data/weeks/YYYY-Www.json\`: one file per ISO week (e.g. 2026-W44 = Monday 26 Oct to Sunday 1 Nov 2026).
- \`data/meta/profile.json\`: heading, values, habits.
- \`pages/\`: readable copies (generated by the app; do not edit). \`backups/\`: snapshots.

## Week file
\`{"id":"2026-W44","monday":"2026-10-26","goals":[{"text":"…","done":false}],"cal":{"mon":"","tue":"","wed":"","thu":"","fri":"","wkd":""},"notes":"","wins":"","reflection":{"well":"","change":"","rating":0},"updatedAt":<unix ms>}\`
- \`goals\`: the weekly goals shown on the week page and under each day's keel task.

## Day file
\`{"date":"YYYY-MM-DD","status":"open","focus":{"text":"","done":false,"area":"","value":"","carried":0},"cream":[{"text":"","done":false,"carried":0},{"text":"","done":false,"carried":0}],"cherries":[],"relax":[{"text":"","done":false}],"grateful":["","",""],"forward":["",""],"notes":"","evening":{"win":"","moment":"","learned":"","rating":0},"habits":{},"createdAt":<unix ms>,"updatedAt":<unix ms>}\`
- \`focus\` = keel task (most important task). \`area\` is one of: ${AREAS.map(([id,n])=>`${id} (${n})`).join(', ')}.
- \`cream\` = the two next-up tasks, \`cherries\` = also-today tasks, \`relax\` = recharge items.

## Rules
1. Read a file before changing it, change only what was asked, and keep every other field exactly as it is.
2. Add, never delete, unless the person explicitly asks. Do not change \`status\` or \`carriedTo\`.
3. Set \`updatedAt\` to the current time in milliseconds when you write a file. Write valid JSON (UTF-8).
4. If a week or day file does not exist yet, create it with the full structure above.
5. Avoid writing while the person is editing the same day in the app; Daykeel merges changes, but simple changes are safest.

## Example requests
- "Read my weekly goals from Notion and add them to Daykeel for this week."
- "Look at my Daykeel week and suggest a keel task for each remaining day."
- "Review my last 30 days in Daykeel and save the review to data/reviews."
`;

    catch(e){S.syncMsg=CLOUD_MODE?'OneDrive could not be reached. Check the internet connection and try again.':'The folder could not be read. Check that it still exists.';}
    S.syncing=false;render();
  },
  // Settings → subfolder inside the OneDrive app folder (web app only).
  async 'set-sub'(){
    const el=$('#subFolder');const v=(el&&el.value||'').trim();
    if(v&&!/^[\w\- ]{1,60}$/.test(v)){S.folderMsg='Use letters, digits, spaces, - or _ only (no slashes).';render();return;}
    if(v===S.sub){S.folderMsg='This folder is already in use.';render();return;}
    if(Object.keys(saveQ).length){S.folderMsg='Wait a moment until all changes are saved.';render();return;}
    S.sub=v;lsSet('smj6:sub',v);S.unlocked.clear();
    await openFolder({name:'OneDrive',path:folderLabel()});
    S.folderMsg=`Now using ${folderLabel()}.`;S.tab='settings';render();
  },
  signout(){Auth.signOut();},
  async connect(a){
    S.connectMsg='';
    if(NATIVE){
      if(Object.keys(saveQ).length){S.connectMsg='Wait a moment until all changes are saved.';render();return;}
      try{const p=await NATIVE.ChooseFolder();if(p) return openFolder({name:p.split('\\').pop(),path:p});}
      catch(e){S.connectMsg='The folder could not be opened. Choose it again.';render();}
      return;
    }
    try{
      if(S.savedDir&&a.dataset.mode!=='pick'){
        const p=await S.savedDir.requestPermission({mode:'readwrite'});
        if(p==='granted') return openFolder(S.savedDir);
      }
      if(Object.keys(saveQ).length){S.folderMsg='Wait a moment until all changes are saved, then choose the folder.';render();return;}
      // Opens the Windows "Select folder" window.
      const h=await window.showDirectoryPicker({id:'smj6-journal',mode:'readwrite',startIn:'documents'});
      if((await h.requestPermission({mode:'readwrite'}))!=='granted'){S.folderMsg='The browser was not allowed to edit files in that folder. Choose it again and click Allow.';render();return;}
      await IDB.set('dir',h); S.savedDir=h;
      if(CLOUD_AVAILABLE){lsSet('smj6:mode','folder');CLOUD_MODE=false;}
      S.unlocked.clear(); await openFolder(h);
      S.folderMsg=`Now using the folder "${h.name}" on this PC.`; if(S.tab==='settings') render();
    }catch(e){if(e&&e.name!=='AbortError'){S.connectMsg=S.folderMsg='The folder could not be opened. Try again or choose another folder.';render();}}
  },
  'use-cloud'(){if(Object.keys(saveQ).length){S.folderMsg='Wait a moment until all changes are saved.';render();return;}lsSet('smj6:mode','cloud');location.reload();},
  'restore-no'(){S.restore=null;render();},
  async 'restore-yes'(){const o=S.restore.data;S.restore=null;S.restoreMsg='Restoring…';render();let n=0,fail=0;
    for(const c of COLS){const src=o[c]||{};for(const [id,data] of Object.entries(src)){if(!data||typeof data!=='object')continue;
      if(c==='days')normDay(data);if(c==='weeks')normWeek(data);S[c].set(id,data);
      try{const snap=JSON.parse(JSON.stringify(data));const res=await store.set(c,id,snap,null,true);S.base.set(c+'/'+id,{etag:res&&res.etag||null,data:snap});n++;}catch(e){fail++;}}}
    S.restoreMsg=`Restored ${n} items.${fail?` ${fail} could not be saved.`:''}`;ensureTimeline();render();},
  retry(){if(CLOUD_MODE&&S.needLogin){A.signin();return;}
    for(const k of Object.keys(saveQ)){const [c,id]=k.split('/');saveQ[k].failed=false;flush(c,id);}}
};

   ${['Connect your storage','Add Daykeel to your home screen','Set your heading and values','Plan your first day'].map((s,i)=>{const y=26+i*22;
     return `<g ${iv('a-in',.4+i*.3)}><circle class="c-goodsoft" cx="166" cy="${y}" r="8"/>${T(180,y+3,s,'t7 b')}</g><path ${iv('a-draw s-good',1.4+i*.3)} fill="none" d="M162 ${y}l2.5 2.5 4-5.5"/>`;}).join('')}`}
];
let introAt=0,introEl=null,introPrev=null;
function showIntro(){
  if(introEl) return;
  introPrev=document.activeElement;
  introEl=document.createElement('div');introEl.className='intro';
  introEl.setAttribute('role','dialog');introEl.setAttribute('aria-modal','true');introEl.setAttribute('aria-label','Daykeel introduction');
  introEl.addEventListener('click',introClick);
  // The progress bar of the current scene drives autoplay; the last scene waits for the user.
  introEl.addEventListener('animationend',e=>{if(e.target.classList.contains('intro-fill')&&introAt<INTRO.length-1)introGo(introAt+1);});
  document.body.appendChild(introEl);document.body.classList.add('intro-open');
  for(const el of [$('header.top'),$('#main')]) if(el) el.inert=true;
  introGo(0);
}
function introGo(i){
  introAt=Math.max(0,Math.min(INTRO.length-1,i));
  const sc=INTRO[introAt],last=introAt===INTRO.length-1;
  introEl.classList.remove('paused');
  introEl.innerHTML=`<div class="intro-card">
    <div class="intro-bars" aria-hidden="true">${INTRO.map((_,k)=>`<i class="${k<introAt?'done':''}">${k===introAt?`<b class="intro-fill" style="--dur:${sc.dur||INTRO_SEC}s"></b>`:''}</i>`).join('')}</div>
    <div class="intro-stage"><svg viewBox="0 0 320 180" aria-hidden="true">${sc.svg()}</svg></div>
    <div class="intro-text" aria-live="polite"><span class="label">${sc.label}</span><h2>${sc.title}</h2><p>${sc.text}</p></div>
    <div class="intro-nav">
      <button class="ghost small" data-iact="back" ${introAt?'':'disabled'}>Back</button>
      <button class="ghost small" data-iact="pause" aria-pressed="false">Pause</button>
      <span class="small muted">${introAt+1} / ${INTRO.length}</span>
      ${last?`<button class="ghost small" data-iact="help">Open Help</button><button class="btn" data-iact="close">Get started</button>`
        :`<button class="linkbtn" data-iact="close">Skip</button><button class="btn" data-iact="next">Next</button>`}
    </div></div>`;
  const b=introEl.querySelector('.btn');if(b)b.focus({preventScroll:true});
}
function introClick(e){
  const b=e.target.closest('[data-iact]');if(!b||b.disabled)return;const k=b.dataset.iact;
  if(k==='next')introGo(introAt+1);
  else if(k==='back')introGo(introAt-1);
  else if(k==='pause'){const p=introEl.classList.toggle('paused');b.textContent=p?'Play':'Pause';b.setAttribute('aria-pressed',String(p));}
  else if(k==='help'){closeIntro();S.tab='help';render();window.scrollTo(0,0);}
  else if(k==='close')closeIntro();
}
function closeIntro(){
  if(!introEl) return;
  introEl.remove();introEl=null;document.body.classList.remove('intro-open');
  for(const el of [$('header.top'),$('#main')]) if(el) el.inert=false;
  if(introPrev&&introPrev.focus) introPrev.focus();
}
document.addEventListener('keydown',e=>{if(!introEl)return;
  if(e.key==='Escape')closeIntro();else if(e.key==='ArrowRight')introGo(introAt+1);else if(e.key==='ArrowLeft')introGo(introAt-1);});

/* ---------- boot ---------- */
// Reads every collection into fresh maps first, so a failed read never wipes what is on screen.
// With background=true the swap is skipped if the user started editing while files were being read.
// S.base remembers the version tag and content of every file as loaded, for conflict-safe saving.
async function loadAll(background){
  const next={},base=new Map();
  for(const c of COLS){next[c]=new Map();
    for(const {id,data,etag} of await store.all(c)){
      // Ignore stray files such as OneDrive conflict copies ("2026-10-18-PC.json").
      if(c==='days'&&!/^\d{4}-\d{2}-\d{2}$/.test(id)) continue;
      if(c==='weeks'&&!/^\d{4}-W\d{2}$/.test(id)) continue;
      if(c==='days')normDay(data); if(c==='weeks')normWeek(data);
      next[c].set(id,data); base.set(c+'/'+id,{etag:etag||null,data:JSON.parse(JSON.stringify(data))});
    }}
  if(background&&(Object.keys(saveQ).length||typing())) return false;
  for(const c of COLS)S[c]=next[c];
  S.base=base;
}
async function openFolder(h){
  const prev=store;S.dir=h;store=NATIVE?nativeStore():CLOUD_MODE?graphStore():fsStore(h);
  $('#main').innerHTML=`<p class="loading">${CLOUD_MODE?'Loading Daykeel from OneDrive…':'Reading your Daykeel folder…'}</p>`;
  try{await loadAll();}
  catch(e){console.warn('folder read failed',e);store=prev;
    S.connectMsg=CLOUD_MODE?(e&&e.code==='auth'?'Your sign-in has expired. Sign in again.':`Your OneDrive could not be read, so nothing was changed. Details: ${e&&e.message||e}`)
      :'The folder could not be read. Choose the folder again in Settings.';
    render();return;}
  if(CLOUD_MODE) restorePending();
  S.lastSync=Date.now();
  ensureTimeline();refreshStatus();render();
}
async function boot(){
  S.tab='calendar'; // the app always starts on the calendar
  S.sub=lsGet('smj6:sub')||'';
  // First start on this device: play the introduction once (marked as seen right away, so a sign-in redirect does not repeat it).
  if(!lsGet('dk:intro')){lsSet('dk:intro','1');showIntro();}
  if(CLOUD_AVAILABLE&&'serviceWorker' in navigator){
    // updateViaCache:'none' makes the browser check sw.js on every start; when a new version takes over, reload once.
    const hadController=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{});
    navigator.serviceWorker.addEventListener('controllerchange',()=>{
      if(hadController&&!Object.keys(saveQ).length&&!sessionStorage.getItem('smj6:reloaded')){try{sessionStorage.setItem('smj6:reloaded','1');}catch(e){}location.reload();}
    });
  }
  if(CLOUD_MODE){
    Auth.load();
    let r='none';
    try{r=await Auth.handleRedirect();}catch(e){console.warn('sign-in failed',e);S.connectMsg='Sign-in did not complete: '+(e.message||'unknown error');}
    if(r==='none'&&Auth.t&&!(await Auth.token())&&!lsGet('smj6:silent')){
      // Session ran out: try one silent sign-in (no prompt) before showing the button.
      lsSet('smj6:silent','1');return Auth.login('none');
    }
    try{localStorage.removeItem('smj6:silent');}catch(e){}
    if(await Auth.token()) return openFolder({name:'OneDrive',path:APP_FOLDER_LABEL});
    return render();
  }
  if(NATIVE){
    try{S.settings=JSON.parse(await NATIVE.GetSettings());const f=await NATIVE.GetFolder();
      if(f) return openFolder({name:f.split('\\').pop(),path:f});}
    catch(e){console.warn('host not ready',e);S.connectMsg='The journal folder could not be read. Choose it again.';}
    return render();
  }
  if('showDirectoryPicker' in window){
    S.savedDir=await IDB.get('dir');
    if(S.savedDir){let p='prompt';try{p=await S.savedDir.queryPermission({mode:'readwrite'});}catch(e){}
      if(p==='granted') return openFolder(S.savedDir);}
  }
  render();
}
boot();
})();
</script>
